[Config]
# Inherit shared API keys, model settings, and Params from config.ini.
# Values declared below override the inherited values.
inherits = config.ini

[Paths]
src_dir = ../benchmarks/c-algorithm/src
test_dir = ../benchmarks/c-algorithm/test
tmp_dir = ../Output/c_algorithm/tmp
output_dir = ../Output/c_algorithm/Output
compile_commands_path = ../benchmarks/c-algorithm/build/compile_commands.json

[ExcludeFiles]
files = alloc-testing, test-alloc-testing, framework, utf8-decoder, test-utf8-decoder, tinyexpr, test-tinyexpr
