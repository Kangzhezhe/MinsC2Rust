[Config]
# Optional. Child configs can inherit common values from one or more parent
# configs. Relative paths are resolved from this config file's directory.
# inherits = config.example.ini

[Paths]
func_result_dir = ../Tool/func_result
src_dir = ../benchmarks/arraylist/src
test_dir = ../benchmarks/arraylist/test
tmp_dir = ../Output/arraylist/tmp
output_dir = ../Output/arraylist/Output
output_project_name = test_project
compile_commands_path = ../benchmarks/arraylist/build/compile_commands.json

[Settings]
model = openai
enable_english_prompt = false
enable_multi_models = false

[LLM_API_Keys]
qwen = env:QWEN_API_KEY
zhipu = env:ZHIPU_API_KEY
deepseek = env:DEEPSEEK_API_KEY
openai_url = env:OPENAI_API_BASE
openai_api_key = env:OPENAI_API_KEY
openai_model = env:OPENAI_MODEL_NAME

[Params]
max_retries = 5
max_regenerations = 3
verify_timeout_seconds = 60
verify_cache_enabled = 1
enable_cc_mini_agent_fallback = 1
cc_mini_max_call_attempts = 2
# runtime 检查粒度：function（编译通过后立即 cargo test）、source_complete（同一测试源完成后统一 cargo test）、off
# test_runtime_check_enabled = 1
# test_runtime_check_mode = function

[ExcludeFiles]
files =
